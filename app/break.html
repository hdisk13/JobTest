<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Five minutes · JobTest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <main class="phone">
      <div class="kicker-row">
        <p class="kicker teal">One sitting</p>
        <p class="kicker muted">After part 3</p>
      </div>
      <h1 class="display title-break">Five minutes</h1>
      <div class="clock-row">
        <p class="clock" id="clock">5:00</p>
        <p class="clock-note">Break · not a session end</p>
      </div>
      <p class="lede light break-stay">
        Don’t go back into the part. Official script is one sitting.
      </p>
      <p class="claim-line">Demo lets you skip the wait. Official admin waits until 0:00.</p>
      <button type="button" class="cta" id="stay">Continue sitting</button>
    </main>
    <script src="js/break.js"></script>
  </body>
</html>
