<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arithmetic Reasoning · JobTest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <main class="phone power">
      <div class="kicker-row">
        <p class="kicker teal">One sitting</p>
        <p class="kicker muted">Part 1 of 6</p>
      </div>
      <h1 class="display title-power">Arithmetic Reasoning</h1>
      <p class="lede light power-lede">
        One item on the sheet. Invented demo — not an official AP item.
      </p>
      <section class="sheet item-sheet">
        <div class="sheet-head">
          <h2>Item 01</h2>
          <p>tap one answer</p>
        </div>
        <p class="stem">
          Nia buys 4 notebooks at $3 each and pays with a $20 bill. How much
          change should she get?
        </p>
        <div class="choices" id="choices">
          <button type="button" class="choice">A · $6</button>
          <button type="button" class="choice">B · $8</button>
          <button type="button" class="choice">C · $12</button>
          <button type="button" class="choice">D · $16</button>
          <button type="button" class="choice">E · none of these</button>
        </div>
      </section>
      <p class="page-foot">
        <span class="keep">one sitting · power part</span>
      </p>
      <a class="ghost" href="index.html">Back to launch</a>
    </main>
    <script src="js/part1.js"></script>
  </body>
</html>
